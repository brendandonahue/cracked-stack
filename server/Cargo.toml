[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json", "secrets"] }
reqwest = { version = "0.13.2", features = ["json", "stream", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
rocket_cors = "0.6.0"
log = "0.4.29"
env_logger = "0.11.8"
base64 = "0.22.1"
surrealdb = { version = "3.0.1", features = ["kv-rocksdb", "protocol-http", "protocol-ws", "kv-mem"] }
surrealdb-types = "3.0.1"
thiserror = "2.0.18"
chrono = { version = "0.4.43", features = ["std", "clock"] }
lettre = { version = "0.11.19", features = ["tokio1", "tokio1-native-tls"] }
dotenvy = "0.15.7"
rocket-governor = "0.2.0-rc.4"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
rand = "0.10.1"
uuid = { version = "1.18", features = ["v4"] }

