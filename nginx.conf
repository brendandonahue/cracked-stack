server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (your existing block — keep it)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Non-prerendered routes (protected pages) now correctly serve 200.html → client auth/redirect works
    location / {
        try_files $uri $uri/ /200.html =404;
    }
}