services:
  cracked-stack-nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  cracked-stack-rust-server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.rust
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8000
      - ROCKET_LOG_LEVEL=normal
      - ROCKET_SECRET_KEY=${ROCKET_SECRET_KEY}
      - ROCKET_ENV=${ROCKET_ENV}
      - SURREALDB_HOST=${SURREALDB_HOST}
      - SURREALDB_PORT=${SURREALDB_PORT}
      - SURREALDB_USER=${SURREALDB_USER}
      - SURREALDB_PASS=${SURREALDB_PASS}
      - SURREALDB_NS=${SURREALDB_NS}
      - SURREALDB_DB=${SURREALDB_DB}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=${FRONTEND_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_CS_MODEL=${OLLAMA_CS_MODEL:-qwen3:14b}
      - UPLOAD_DIR=/uploads

    networks:
      - app-net
    volumes:
      - uploads-volume:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-net:
    external: true

volumes:
  uploads-volume: